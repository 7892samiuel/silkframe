name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.1'
          package-manager-cache: false
      - name: Check portable components
        run: ./scripts/Test-Release.ps1 -SkipWindowTests
      - name: Build archives
        run: ./scripts/Build-Release.ps1 -SkipTests
      - uses: actions/upload-artifact@v7
        with:
          name: preview-release
          path: dist/*
          if-no-files-found: error
